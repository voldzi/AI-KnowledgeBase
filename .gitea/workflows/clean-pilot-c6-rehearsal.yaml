name: AKB Clean Pilot C6 Disposable Rehearsal

on:
  workflow_dispatch:
    inputs:
      approved_source_sha:
        description: Exact frozen AKB source SHA covered by the C4 manifest
        required: true
        type: string
      c4_artifact_id:
        description: Server-visible C4 artifact ID
        required: true
        type: string
      c4_manifest_sha256:
        description: Expected raw SHA-256 of clean-pilot-c4-image-manifest.json
        required: true
        type: string

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  rehearsal:
    name: Run isolated disposable C6 rehearsal
    runs-on: akb-gitea-ci
    timeout-minutes: 45
    steps:
      - name: Check out frozen source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.approved_source_sha }}
          fetch-depth: 0
      - name: Verify frozen source and fetch C4 manifest
        env:
          AKB_SOURCE_SHA: ${{ inputs.approved_source_sha }}
          AKB_C4_ARTIFACT_ID: ${{ inputs.c4_artifact_id }}
          AKB_C4_MANIFEST_SHA256: ${{ inputs.c4_manifest_sha256 }}
          AKB_GITEA_API_URL: ${{ github.api_url }}
          AKB_GITEA_REPOSITORY: ${{ github.repository }}
          GITEA_TOKEN: ${{ gitea.token }}
        run: |
          set -euo pipefail
          [[ "${AKB_SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "${AKB_SOURCE_SHA}" ]]
          [[ "${AKB_C4_ARTIFACT_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${AKB_C4_MANIFEST_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          python3 - <<'PY'
          import hashlib, io, json, os, pathlib, re, urllib.request, zipfile

          api = os.environ["AKB_GITEA_API_URL"].rstrip("/")
          repository = os.environ["AKB_GITEA_REPOSITORY"]
          if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repository):
              raise SystemExit("C6_REPOSITORY_INVALID")
          artifact_id = os.environ["AKB_C4_ARTIFACT_ID"]
          request = urllib.request.Request(
              f"{api}/repos/{repository}/actions/artifacts/{artifact_id}/zip",
              headers={"Authorization": f"token {os.environ['GITEA_TOKEN']}"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              archive = response.read()
          with zipfile.ZipFile(io.BytesIO(archive)) as bundle:
              names = bundle.namelist()
              if names != ["clean-pilot-c4-image-manifest.json"]:
                  raise SystemExit("C6_C4_ARTIFACT_NOT_CLOSED")
              manifest = bundle.read(names[0])
          if hashlib.sha256(manifest).hexdigest() != os.environ["AKB_C4_MANIFEST_SHA256"]:
              raise SystemExit("C6_C4_MANIFEST_DIGEST_MISMATCH")
          value = json.loads(manifest)
          if value.get("sourceCommit") != os.environ["AKB_SOURCE_SHA"]:
              raise SystemExit("C6_C4_SOURCE_MISMATCH")
          pathlib.Path("clean-pilot-c4-image-manifest.json").write_bytes(manifest)
          PY
      - name: Build closed disposable bundle
        env:
          AKB_SOURCE_SHA: ${{ inputs.approved_source_sha }}
        run: |
          python3 - <<'PY'
          import json, pathlib, os
          from tools.clean_pilot_stack_rehearsal import REQUIRED_SURFACES, tree_digest

          root = pathlib.Path.cwd()
          c4 = json.loads(pathlib.Path("clean-pilot-c4-image-manifest.json").read_text())
          migration = tree_digest(root, ["services/registry-api/alembic", "infra/postgres/init"])
          value = {
              "schemaVersion": "akb-clean-pilot-stack-bundle-1",
              "repository": "AKB/ai-knowledgebase",
              "sourceCommit": os.environ["AKB_SOURCE_SHA"],
              "migrationBundleSha256": migration,
              "imageBundleSha256": c4["imageBundleSha256"],
              "images": c4["images"],
              "surfaces": sorted(REQUIRED_SURFACES),
              "networkPolicy": "internal-no-egress",
              "credentialPolicy": "generated-ephemeral-only",
              "productionConnectivity": False,
              "composePath": "infra/clean-pilot/docker-compose.rehearsal.yml",
          }
          pathlib.Path("clean-pilot-c6-bundle.json").write_text(
              json.dumps(value, separators=(",", ":"), sort_keys=True) + "\n"
          )
          PY
      - name: Run disposable rehearsal
        env:
          AKB_SOURCE_SHA: ${{ inputs.approved_source_sha }}
          AKB_REGISTRY_USER: ${{ github.actor }}
          AKB_REGISTRY_TOKEN: ${{ secrets.AKB_GITEA_PACKAGE_RW_TOKEN }}
          AKB_RUN_ID: c6-run-${{ github.run_id }}
        run: |
          set -euo pipefail
          cleanup() {
            docker logout git.home.cz >/dev/null 2>&1 || true
          }
          trap cleanup EXIT INT TERM
          printf '%s' "${AKB_REGISTRY_TOKEN}" \
            | docker login git.home.cz --username "${AKB_REGISTRY_USER}" --password-stdin >/dev/null
          unset AKB_REGISTRY_TOKEN
          python3 - <<'PY' > clean-pilot-c6-result.json
          import json, os, subprocess, sys
          from pathlib import Path
          import tools.clean_pilot_stack_rehearsal as rehearsal

          def diagnostic_run(command, *, env, cwd, check=True):
              result = subprocess.run(command, cwd=cwd, env=env, text=True, capture_output=True)
              if check and result.returncode:
                  diagnostic = result.stderr + "\n" + result.stdout
                  project = env.get("AKB_REHEARSAL_PROJECT", "")
                  if project and command[:2] == ["docker", "compose"]:
                      listing = subprocess.run(
                          ["docker", "ps", "-a", "--filter", f"label=com.docker.compose.project={project}", "--format", "{{.ID}} {{.Names}} {{.Status}}"],
                          cwd=cwd, env=env, text=True, capture_output=True,
                      )
                      diagnostic += "\nC6_CONTAINER_STATUS\n" + listing.stdout
                      for line in listing.stdout.splitlines():
                          container_id = line.split(" ", 1)[0]
                          if not container_id:
                              continue
                          logs = subprocess.run(
                              ["docker", "logs", "--tail", "120", container_id],
                              cwd=cwd, env=env, text=True, capture_output=True,
                          )
                          diagnostic += f"\nC6_CONTAINER_LOG {container_id[:12]}\n{logs.stderr}\n{logs.stdout}"
                  for key in (
                      "AKB_REHEARSAL_POSTGRES_PASSWORD", "AKB_REHEARSAL_S3_ACCESS_KEY",
                      "AKB_REHEARSAL_S3_SECRET_KEY", "AKB_REHEARSAL_SESSION_SECRET",
                      "AKB_REHEARSAL_DOWNLOAD_SECRET", "AKB_REHEARSAL_UPLOAD_SECRET",
                  ):
                      value = env.get(key, "")
                      if value:
                          diagnostic = diagnostic.replace(value, "[REDACTED]")
                  print("C6_COMMAND_DIAGNOSTIC_START", file=sys.stderr)
                  print(diagnostic[-30000:], file=sys.stderr)
                  print("C6_COMMAND_DIAGNOSTIC_END", file=sys.stderr)
                  rehearsal.stop("REHEARSAL_COMMAND_FAILED")
              return result

          rehearsal._run = diagnostic_run
          result = rehearsal.execute_rehearsal(
              Path("clean-pilot-c6-bundle.json"),
              Path("/tmp/akb-clean-pilot-c6-markers"),
              os.environ["AKB_RUN_ID"],
              os.environ["AKB_SOURCE_SHA"],
          )
          print(json.dumps(result, sort_keys=True))
          PY
          python3 - <<'PY'
          import json, pathlib
          result = json.loads(pathlib.Path("clean-pilot-c6-result.json").read_text())
          if result.get("result") != "PASS" or result.get("cleanup") != "PASS":
              raise SystemExit("C6_RESULT_NOT_PASS")
          if result.get("secondBootstrap") != "NO_OP":
              raise SystemExit("C6_SECOND_BOOTSTRAP_NOT_NOOP")
          PY
      - name: Publish closed C6 evidence
        id: publish-c6
        uses: ChristopherHX/gitea-upload-artifact@81f940d004763f986ba3582c007fd842dd5cb0d7
        with:
          name: akb-clean-pilot-c6-${{ inputs.approved_source_sha }}-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: clean-pilot-c6-result.json
      - name: Verify C6 artifact is server-visible
        env:
          GITEA_TOKEN: ${{ gitea.token }}
          AKB_GITEA_RUN_ATTEMPT: ${{ gitea.run_attempt }}
          AKB_ARTIFACT_ID: ${{ steps.publish-c6.outputs.artifact-id }}
        run: |
          python3 scripts/ci/verify_gitea_action_artifact.py \
            --api-url "${{ github.api_url }}" \
            --repository "${{ github.repository }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${AKB_GITEA_RUN_ATTEMPT:-1}" \
            --commit "${{ github.sha }}" \
            --ref "${{ github.ref }}" \
            --event "${{ github.event_name }}" \
            --artifact-id "${AKB_ARTIFACT_ID}" \
            --artifact-name "akb-clean-pilot-c6-${{ inputs.approved_source_sha }}-${{ github.run_id }}"
