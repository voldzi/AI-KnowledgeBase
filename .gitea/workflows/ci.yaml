name: AKB shadow CI

# Verification-only internal CI. It never receives production secrets, builds a
# production release, or connects to docker.home.cz.
on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:

env:
  AKB_CI_CACHE_ROOT: /cache/akb-ci
  PIP_CACHE_DIR: /cache/akb-ci/pip
  PLAYWRIGHT_BROWSERS_PATH: /cache/akb-ci/playwright
  PNPM_STORE_DIR: /cache/akb-ci/pnpm-store

jobs:
  standards:
    name: Repository standards
    runs-on: akb-gitea-light
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify repository contracts
        run: |
          set -euo pipefail
          bash scripts/validate-skeleton.sh
          ruby scripts/generate_openapi_index.rb --check
          python3 -m json.tool openapi/openapi.json >/dev/null
          python3 scripts/check_embedding_shadow_profiles.py
          npx --yes @redocly/cli lint openapi/openapi.json
      - name: Scan committed history for secrets
        run: |
          set -euo pipefail
          version="8.24.3"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          expected_sha256="9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"
          cache_root="${AKB_CI_CACHE_ROOT}/gitleaks/${version}"
          binary="${cache_root}/gitleaks"
          if [[ ! -x "${binary}" ]]; then
            mkdir -p "${cache_root}"
            tmp_dir="$(mktemp -d)"
            trap 'rm -rf "${tmp_dir}"' EXIT
            curl --fail --location --silent --show-error \
              "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}" \
              --output "${tmp_dir}/${archive}"
            printf '%s  %s\n' "${expected_sha256}" "${tmp_dir}/${archive}" | sha256sum -c
            tar -xzf "${tmp_dir}/${archive}" -C "${cache_root}" gitleaks
            chmod 0755 "${binary}"
          fi
          "${binary}" git . --config gitleaks.toml --redact --no-banner

  immutable-release:
    name: Immutable release contract
    runs-on: akb-gitea-exclusive
    container: akb/gitea-ci-tools:0.2.0
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate immutable release workflow
        run: |
          set -euo pipefail
          # The contract test deliberately injects SIGKILL at release boundaries.
          # Keep that signal inside a disposable, non-privileged container rather
          # than allowing a host executor to mistake it for a failed worker.
          # The Docker daemon sees the runner's host paths, not its /data bind
          # mount. Resolve the corresponding host path from the runner itself.
          runner_data_host_path="$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/data"}}{{.Source}}{{end}}{{end}}' "$HOSTNAME")"
          test -n "$runner_data_host_path"
          workspace_host_path="${runner_data_host_path}${PWD#/data}"
          test -f "$workspace_host_path/scripts/check_immutable_release_workflow.sh"
          docker run --rm --pull never --init \
            --entrypoint /bin/bash \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=2g \
            --user 1001:107 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --volume "$workspace_host_path:/workspace:ro" \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --workdir /workspace \
            akb/gitea-ci-tools:0.2.0 \
            scripts/check_immutable_release_workflow.sh

  web:
    name: Web
    runs-on: akb-gitea-light
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          pnpm --version
          pnpm install --frozen-lockfile --store-dir "$PNPM_STORE_DIR"
      - name: Validate, test, and build
        run: |
          pnpm semantic-registry:check
          pnpm typecheck
          pnpm test
          pnpm build
      - name: Run end-to-end tests
        run: |
          # The runner keeps this cache across jobs. Playwright verifies it and
          # downloads Chromium only when it is missing or incompatible.
          pnpm exec playwright install chromium
          pnpm test:e2e

  python-services:
    name: Python / ${{ matrix.service }}
    runs-on: akb-gitea-light
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: registry-api
            working-directory: services/registry-api
            install-command: python3 -m pip install -e ".[test]"
          - service: ingestion-service
            working-directory: services/ingestion-service
            install-command: python3 -m pip install -r requirements.txt
          - service: rag-retrieval-service
            working-directory: services/rag-retrieval-service
            install-command: python3 -m pip install -r requirements.txt
          - service: llm-gateway-service
            working-directory: services/llm-gateway-service
            install-command: python3 -m pip install -r requirements.txt
          - service: evaluation-service
            working-directory: services/evaluation-service
            install-command: python3 -m pip install -r requirements.txt
          - service: governance-service
            working-directory: services/governance-service
            install-command: python3 -m pip install -r requirements.txt
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install dependencies and test
        working-directory: ${{ matrix.working-directory }}
        env:
          PYTHONPATH: .
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          ${{ matrix.install-command }}
          python -m pytest

  compose:
    name: Docker Compose configuration
    runs-on: akb-gitea-light
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate supported runtime configurations
        run: |
          set -euo pipefail
          docker compose --env-file .env.example \
            -f infra/docker-compose/docker-compose.dev.yml config >/tmp/akb-compose-dev.yml
          docker compose --env-file .env.local-prod.example \
            -f infra/docker-compose/docker-compose.dev.yml \
            -f infra/docker-compose/docker-compose.local-prod.yml config >/tmp/akb-compose-local-prod.yml
          AKB_POLICY_SERVICE_TOKEN=dummy-akb-policy-service-token \
          AKB_AIIP_INGEST_SERVICE_TOKEN=dummy-aiip-ingest-service-token \
          docker compose --env-file infra/docker-compose/docker-home.env.example \
            -f infra/docker-compose/docker-compose.docker-home.yml config >/tmp/akb-compose-docker-home.yml
