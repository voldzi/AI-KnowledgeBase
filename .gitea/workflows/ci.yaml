name: AKB CI

# Verification-only trusted CI. It never receives production secrets, builds a
# production release, or connects to docker.home.cz. Pull requests do not run
# here automatically because this runner has the host Docker socket.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Full reviewed commit SHA selected for the trusted runner
        required: true
        type: string

permissions:
  contents: read

env:
  AKB_CI_CACHE_ROOT: /cache/akb-ci
  DOCKER_CONFIG: /tmp/akb-docker-config
  PIP_CACHE_DIR: /cache/akb-ci/pip
  PLAYWRIGHT_BROWSERS_PATH: /cache/akb-ci/playwright
  PNPM_STORE_DIR: /cache/akb-ci/pnpm-store

jobs:
  trusted-candidate:
    name: Trusted candidate approval
    runs-on: akb-gitea-ci
    timeout-minutes: 5
    steps:
      - name: Verify trusted execution boundary
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
          CANDIDATE_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "push" ]]; then
            exit 0
          fi
          [[ "${EVENT_NAME}" == "workflow_dispatch" ]] || {
            printf 'Unsupported trusted CI event: %s\n' "${EVENT_NAME}" >&2
            exit 1
          }
          [[ "${APPROVED_SHA}" =~ ^[0-9a-f]{40}$ ]] || {
            printf 'approved_sha must be a full lowercase Git SHA.\n' >&2
            exit 1
          }
          [[ "${APPROVED_SHA}" == "${CANDIDATE_SHA}" ]] || {
            printf 'The reviewed SHA does not match the dispatched ref.\n' >&2
            exit 1
          }

  impact:
    name: Runtime impact plan
    runs-on: akb-gitea-ci
    needs: trusted-candidate
    timeout-minutes: 5
    outputs:
      web: ${{ steps.plan.outputs.web }}
      registry_api: ${{ steps.plan.outputs.registry_api }}
      ingestion_service: ${{ steps.plan.outputs.ingestion_service }}
      rag_retrieval_service: ${{ steps.plan.outputs.rag_retrieval_service }}
      llm_gateway_service: ${{ steps.plan.outputs.llm_gateway_service }}
      evaluation_service: ${{ steps.plan.outputs.evaluation_service }}
      governance_service: ${{ steps.plan.outputs.governance_service }}
      compose: ${{ steps.plan.outputs.compose }}
      immutable_release: ${{ steps.plan.outputs.immutable_release }}
    steps:
      - name: Check out reviewed history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Select affected verification jobs
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base_sha=""
          if [[ "${EVENT_NAME}" == "push" ]]; then
            base_sha="$(git rev-parse "${HEAD_SHA}^" 2>/dev/null || true)"
          else
            git fetch origin main --quiet
            base_sha="$(git merge-base "${HEAD_SHA}" origin/main 2>/dev/null || true)"
          fi
          if [[ ! "${base_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            # A missing comparison base is uncertain and selects every check.
            printf '%s\n' pyproject.toml > changed-paths.txt
          else
            git diff --name-only "${base_sha}" "${HEAD_SHA}" -- > changed-paths.txt
          fi
          python3 scripts/ci/affected_components.py \
            changed-paths.txt --github-output "${GITHUB_OUTPUT}"

  standards:
    name: Repository standards
    runs-on: akb-gitea-ci
    needs: trusted-candidate
    timeout-minutes: 15
    steps:
      - name: Check out repository
        env:
          GITEA_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          git -c http.extraheader="Authorization: token ${GITEA_TOKEN}" fetch --quiet origin \
            '+refs/heads/*:refs/remotes/origin/*' --tags
          git checkout --detach "${{ github.sha }}"
          [[ "$(git rev-parse HEAD)" == "${{ github.sha }}" ]]
      - name: Verify repository contracts
        run: |
          set -euo pipefail
          bash scripts/validate-skeleton.sh
          ruby scripts/generate_openapi_index.rb --check
          python3 -m json.tool openapi/openapi.json >/dev/null
          python3 scripts/check_embedding_shadow_profiles.py
          python3 tests/test_gitea_ci_operations.py
          python3 tests/test_gitea_production_deploy.py
          python3 tests/test_ci_affected_components.py
          npx --yes @redocly/cli lint openapi/openapi.json
      - name: Scan committed history for secrets
        run: |
          set -euo pipefail
          version="8.24.3"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          expected_sha256="9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"
          cache_root="${AKB_CI_CACHE_ROOT}/gitleaks/${version}"
          binary="${cache_root}/gitleaks"
          if [[ ! -x "${binary}" ]]; then
            mkdir -p "${cache_root}"
            tmp_dir="$(mktemp -d)"
            trap 'rm -rf "${tmp_dir}"' EXIT
            curl --fail --location --silent --show-error \
              "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}" \
              --output "${tmp_dir}/${archive}"
            printf '%s  %s\n' "${expected_sha256}" "${tmp_dir}/${archive}" | sha256sum -c
            tar -xzf "${tmp_dir}/${archive}" -C "${cache_root}" gitleaks
            chmod 0755 "${binary}"
          fi
          # Verbose findings retain the rule, file, and commit while `--redact`
          # prevents the matched value from entering the CI log.
          "${binary}" git . --config gitleaks.toml --redact --no-banner --verbose

  immutable-release:
    name: Immutable release contract
    runs-on: akb-gitea-ci
    needs: [trusted-candidate, impact]
    if: ${{ needs.impact.outputs.immutable_release == 'true' }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        env:
          GITEA_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote remove origin 2>/dev/null || true
          git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          git -c http.extraheader="Authorization: token ${GITEA_TOKEN}" fetch --depth=1 origin "${{ github.sha }}"
          git checkout --detach FETCH_HEAD
      - name: Validate immutable release workflow
        run: |
          set -euo pipefail
          # The contract test deliberately injects SIGKILL at release boundaries.
          # Run it directly in the dedicated repo-scoped Docker executor so its
          # fake Docker boundary remains visible to the same shell process.
          shellcheck --version >/dev/null
          install -d -m 0755 "${DOCKER_CONFIG}"
          docker compose version >/dev/null
          unset DOCKER_CONFIG
          setpriv --reuid=1001 --regid=107 --clear-groups \
            env HOME=/home/akbci bash scripts/check_immutable_release_workflow.sh

  web:
    name: Web
    runs-on: akb-gitea-ci
    needs: [trusted-candidate, impact]
    if: ${{ needs.impact.outputs.web == 'true' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Install dependencies
        run: |
          pnpm --version
          pnpm install --frozen-lockfile --store-dir "$PNPM_STORE_DIR"
      - name: Validate, test, and build
        run: |
          mkdir -p "$AKB_CI_CACHE_ROOT/next/web" .next
          ln -sfn "$AKB_CI_CACHE_ROOT/next/web" .next/cache
          pnpm semantic-registry:check
          pnpm typecheck
          pnpm test
          pnpm build
      - name: Run end-to-end tests
        run: |
          # The runner keeps this cache across jobs. Playwright verifies it and
          # downloads Chromium only when it is missing or incompatible.
          pnpm exec playwright install chromium
          pnpm test:e2e

  registry-api:
    name: Python / registry-api
    runs-on: akb-gitea-ci
    needs: [trusted-candidate, impact]
    if: ${{ needs.impact.outputs.registry_api == 'true' }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Install dependencies and test
        working-directory: services/registry-api
        env:
          PYTHONPATH: .
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python3 -m pip install -e ".[test]"
          python -m pytest

  ingestion-service:
    name: Python / ingestion-service
    runs-on: akb-gitea-ci
    needs: [trusted-candidate, impact]
    if: ${{ needs.impact.outputs.ingestion_service == 'true' }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Install dependencies and test
        working-directory: services/ingestion-service
        env:
          PYTHONPATH: .
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python -m pytest

  rag-retrieval-service:
    name: Python / rag-retrieval-service
    runs-on: akb-gitea-ci
    needs: [trusted-candidate, impact]
    if: ${{ needs.impact.outputs.rag_retrieval_service == 'true' }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Install dependencies and test
        working-directory: services/rag-retrieval-service
        env:
          PYTHONPATH: .
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python -m pytest

  llm-gateway-service:
    name: Python / llm-gateway-service
    runs-on: akb-gitea-ci
    needs: [trusted-candidate, impact]
    if: ${{ needs.impact.outputs.llm_gateway_service == 'true' }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Install dependencies and test
        working-directory: services/llm-gateway-service
        env:
          PYTHONPATH: .
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python -m pytest

  evaluation-service:
    name: Python / evaluation-service
    runs-on: akb-gitea-ci
    needs: [trusted-candidate, impact]
    if: ${{ needs.impact.outputs.evaluation_service == 'true' }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Install dependencies and test
        working-directory: services/evaluation-service
        env:
          PYTHONPATH: .
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python -m pytest

  governance-service:
    name: Python / governance-service
    runs-on: akb-gitea-ci
    needs: [trusted-candidate, impact]
    if: ${{ needs.impact.outputs.governance_service == 'true' }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Install dependencies and test
        working-directory: services/governance-service
        env:
          PYTHONPATH: .
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python -m pytest

  compose:
    name: Docker Compose configuration
    runs-on: akb-gitea-ci
    needs: [trusted-candidate, impact]
    if: ${{ needs.impact.outputs.compose == 'true' }}
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Validate supported runtime configurations
        run: |
          set -euo pipefail
          install -d -m 0755 "${DOCKER_CONFIG}"
          docker compose --env-file .env.example \
            -f infra/docker-compose/docker-compose.dev.yml config >/tmp/akb-compose-dev.yml
          docker compose --env-file .env.local-prod.example \
            -f infra/docker-compose/docker-compose.dev.yml \
            -f infra/docker-compose/docker-compose.local-prod.yml config >/tmp/akb-compose-local-prod.yml
          AKB_POLICY_SERVICE_TOKEN=dummy-akb-policy-service-token \
          bash scripts/check_docker_home_compose_render.sh
