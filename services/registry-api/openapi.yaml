  /api/v1/documents/ingestion-attempts/current:
    get:
      summary: List Document Ingestion Attempts Current
      description: 'Return current attempts only for documents visible to the caller.


        The dashboard needs a complete operational projection, but issuing one

        authorized request per document makes its latency grow linearly. Resolve

        the document boundary once, then load all matching attempts in one query.'
      operationId: list_document_ingestion_attempts_current_api_v1_documents_ingestion_attempts_current_get
      parameters:
      - name: document_id
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          title: Document Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionAttemptListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
