openapi: 3.1.0
info:
  title: AKL Identity & Document Registry API
  description: Registry service for controlled documents, versions, access policies,
    authorization decisions, and audit events. It does not implement ingestion, RAG,
    or LLM logic.
  version: dev
paths:
  /health:
    get:
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /ready:
    get:
      summary: Ready
      operationId: ready_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Ready Ready Get
  /api/v1/integrations/ingestion/readiness:
    get:
      summary: Ingestion Service Readiness
      operationId: ingestion_service_readiness_api_v1_integrations_ingestion_readiness_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Ingestion Service Readiness Api V1 Integrations Ingestion
                  Readiness Get
  /api/v1/integrations/ingestion/authorizations/confirm:
    post:
      summary: Confirm Ingestion Authorization Proof
      operationId: confirm_ingestion_authorization_proof_api_v1_integrations_ingestion_authorizations_confirm_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestionAuthorizationConfirmRequest'
