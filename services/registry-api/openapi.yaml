          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                session_id_hash:
                  pattern: ^[0-9a-f]{64}$
                  title: Session Id Hash
                  type: string
                subject_id:
                  maxLength: 160
                  minLength: 1
                  title: Subject Id
                  type: string
                issuer:
                  maxLength: 512
                  minLength: 1
                  title: Issuer
                  type: string
                client_id:
                  maxLength: 160
                  minLength: 1
                  title: Client Id
                  type: string
                keycloak_session_id:
                  anyOf:
                  - maxLength: 160
                    type: string
                  - type: 'null'
                  title: Keycloak Session Id
                encrypted_payload:
                  maxLength: 65536
                  minLength: 40
                  title: Encrypted Payload
                  type: string
                persistent:
                  default: false
                  title: Persistent
                  type: boolean
                identity_validated_at:
                  format: date-time
                  title: Identity Validated At
                  type: string
                last_seen_at:
                  format: date-time
                  title: Last Seen At
                  type: string
                idle_expires_at:
                  format: date-time
                  title: Idle Expires At
                  type: string
                absolute_expires_at:
                  format: date-time
                  title: Absolute Expires At
                  type: string
              required:
              - session_id_hash
              - subject_id
              - issuer
              - client_id
              - encrypted_payload
              - identity_validated_at
              - last_seen_at
              - idle_expires_at
              - absolute_expires_at
              title: WebSessionWrite
              type: object
