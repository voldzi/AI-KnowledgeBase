  /api/v1/controlled-documentation/rules:
    get:
      summary: List Controlled Document Rules
      operationId: list_controlled_document_rules_api_v1_controlled_documentation_rules_get
      parameters:
      - name: domain
        in: query
        required: true
        schema:
          type: string
          minLength: 2
          maxLength: 80
          title: Domain
      - name: valid_on
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Valid On
      - name: approved_only
        in: query
        required: false
        schema:
          type: boolean
          description: False requires document update or version publication permission; ordinary readers receive only verified rules.
          default: true
          title: Approved Only
        description: False requires document update or version publication permission; ordinary readers receive only verified rules.
      - name: include_inactive
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Inactive
      - name: consumer_view
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Consumer View
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlledRuleListResponse'
        '403':
          description: The subject cannot review unverified rules or inactive packages
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
