name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AKB_CI_CACHE_ROOT: /home/akbci/.cache/akb-ci
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PIP_CACHE_DIR: /home/akbci/.cache/akb-ci/pip
  PLAYWRIGHT_BROWSERS_PATH: /home/akbci/.cache/akb-ci/playwright
  PNPM_STORE_DIR: /home/akbci/.cache/akb-ci/pnpm-store

jobs:
  standards:
    name: Repository Standards
    runs-on: [self-hosted, Linux, X64, akb-ci-light]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up Ruby
        if: runner.environment == 'github-hosted'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Verify preinstalled Ruby
        if: runner.environment == 'self-hosted'
        run: ruby --version

      - name: Validate skeleton
        run: bash scripts/validate-skeleton.sh

      - name: Verify generated OpenAPI is current
        run: ruby scripts/generate_openapi_index.rb --check

      - name: Validate OpenAPI JSON
        run: python3 -m json.tool openapi/openapi.json >/tmp/akb-openapi.json

      - name: Verify embedding shadow profiles
        run: python3 scripts/check_embedding_shadow_profiles.py

      - name: Verify Gitea CI and production deployment controls
        run: |
          python3 tests/test_gitea_ci_operations.py
          python3 tests/test_gitea_production_deploy.py

      - name: Lint OpenAPI
        run: npx --yes @redocly/cli lint openapi/openapi.json

      - name: Secret scan
        shell: bash
        run: |
          set -euo pipefail
          version="8.24.3"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          expected_sha256="9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"
          cache_root="${AKB_CI_CACHE_ROOT:-${RUNNER_TEMP}}/gitleaks/${version}"
          binary="${cache_root}/gitleaks"

          if [[ ! -x "${binary}" ]]; then
            mkdir -p "${cache_root}"
            tmp_dir="$(mktemp -d)"
            trap 'rm -rf "${tmp_dir}"' EXIT
            curl --fail --location --silent --show-error \
              "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}" \
              --output "${tmp_dir}/${archive}"
            printf '%s  %s\n' "${expected_sha256}" "${tmp_dir}/${archive}" | sha256sum --check
            tar -xzf "${tmp_dir}/${archive}" -C "${cache_root}" gitleaks
            chmod 0755 "${binary}"
          fi

          "${binary}" git . \
            --config gitleaks.toml \
            --redact \
            --no-banner

  immutable-release:
    name: Immutable release, ingestion, and containerized PostgreSQL toolchain
    runs-on: akb-ci-exclusive

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install shellcheck
        if: runner.environment == 'github-hosted'
        run: sudo apt-get update && sudo apt-get install --yes shellcheck

      - name: Verify preinstalled shellcheck
        if: runner.environment == 'self-hosted'
        run: shellcheck --version

      - name: Validate immutable release workflow including ingestion
        run: bash scripts/check_immutable_release_workflow.sh

  web:
    name: Web
    runs-on: [self-hosted, Linux, X64, akb-ci-light]
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --store-dir "$PNPM_STORE_DIR"

      - name: Verify local semantic registry
        run: pnpm semantic-registry:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        if: runner.environment == 'github-hosted'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright browser on self-hosted runner
        if: runner.environment == 'self-hosted'
        run: pnpm exec playwright install chromium

      - name: End-to-end test
        run: pnpm test:e2e

  python-services:
    name: Python / ${{ matrix.service }}
    runs-on: [self-hosted, Linux, X64, akb-ci-light]
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: registry-api
            working-directory: services/registry-api
            dependency-file: services/registry-api/pyproject.toml
            install-command: python -m pip install -e ".[test]"
          - service: ingestion-service
            working-directory: services/ingestion-service
            dependency-file: services/ingestion-service/requirements.txt
            install-command: python -m pip install -r requirements.txt
          - service: rag-retrieval-service
            working-directory: services/rag-retrieval-service
            dependency-file: services/rag-retrieval-service/requirements.txt
            install-command: python -m pip install -r requirements.txt
          - service: llm-gateway-service
            working-directory: services/llm-gateway-service
            dependency-file: services/llm-gateway-service/requirements.txt
            install-command: python -m pip install -r requirements.txt
          - service: evaluation-service
            working-directory: services/evaluation-service
            dependency-file: services/evaluation-service/requirements.txt
            install-command: python -m pip install -r requirements.txt
          - service: governance-service
            working-directory: services/governance-service
            dependency-file: services/governance-service/requirements.txt
            install-command: python -m pip install -r requirements.txt

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ${{ matrix.working-directory }}
        run: ${{ matrix.install-command }}

      - name: Run tests
        working-directory: ${{ matrix.working-directory }}
        env:
          PYTHONPATH: .
        run: python -m pytest

  registry-postgres:
    name: Registry API / PostgreSQL
    runs-on: akb-ci-exclusive
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: akl
          POSTGRES_USER: akl_platform
          POSTGRES_PASSWORD: akl_local_postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U akl_platform -d akl"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Registry API dependencies
        working-directory: services/registry-api
        run: python -m pip install -e ".[test]"

      - name: Run PostgreSQL migration and integration smoke
        env:
          AKL_REGISTRY_PG_ADMIN_URL: postgresql://akl_platform:akl_local_postgres@localhost:5432/akl
          AKL_REGISTRY_PG_DATABASE: akl_registry_smoke
        run: python scripts/registry_postgres_smoke.py

      - name: Verify ingestion-attempt upgrade, backfill, integrity, and concurrency
        working-directory: services/registry-api
        env:
          PYTHONPATH: .
          AKL_REGISTRY_MIGRATION_TEST_ADMIN_URL: postgresql://akl_platform:akl_local_postgres@localhost:5432/akl
        run: >-
          python -m pytest
          tests/test_ingestion_attempt_migration.py
          -q

  compose:
    name: Docker Compose Config
    runs-on: [self-hosted, Linux, X64, akb-ci-light]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate development compose config
        run: |
          docker compose \
            --env-file .env.example \
            -f infra/docker-compose/docker-compose.dev.yml \
            config >/tmp/akl-compose-dev.yml

      - name: Validate local production compose config
        run: |
          docker compose \
            --env-file .env.local-prod.example \
            -f infra/docker-compose/docker-compose.dev.yml \
            -f infra/docker-compose/docker-compose.local-prod.yml \
            config >/tmp/akl-compose-local-prod.yml

      - name: Validate docker.home.cz compose config
        run: |
          AKB_POLICY_SERVICE_TOKEN=dummy-akb-policy-service-token \
          docker compose \
            --env-file infra/docker-compose/docker-home.env.example \
            -f infra/docker-compose/docker-compose.docker-home.yml \
            config >/tmp/akl-compose-docker-home.yml
          grep -F \
            'AKL_STRATOS_BUDGET_AKB_RESOURCES_URL: http://stratos-api:4000/api/v1/integrations/budget/akb/resources' \
            /tmp/akl-compose-docker-home.yml
