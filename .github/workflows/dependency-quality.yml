name: Dependency Quality

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  PNPM_STORE_DIR: /home/akbci/.cache/akb-ci/pnpm-store

jobs:
  dependency-quality:
    name: Freshness, vulnerabilities, parity, and SBOM
    runs-on: [self-hosted, Linux, X64, akb-ci-light]

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.8.1"
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.14"

      - name: Install exact audit tools and web dependencies
        run: |
          python -m pip install uv==0.12.9 pip-audit==2.10.0
          pnpm --dir apps/web install --frozen-lockfile --store-dir "$PNPM_STORE_DIR"

      - name: Verify dependency quality
        run: python scripts/ci/quality_dependencies.py --output .artifacts/quality

      - name: Preserve dependency evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: akb-dependency-quality-${{ github.sha }}
          path: .artifacts/quality/
          if-no-files-found: error
